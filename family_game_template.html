<title>Kanji Family Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sorting table. Family seals (baskets) sit across the top of a sheet; one kanji tile waits
   in the middle; your growing tree map runs along the bottom. Indigo seal ink on cool paper, same
   identity as the Kanji Family Tree page; status colours only where status is shown. */
:root {
  --paper: #eef1f6;
  --sheet: #ffffff;
  --ink: #1b2233;
  --muted: #5d6679;
  --line: #d6dce6;
  --indigo: #2c4a8c;
  --indigo-soft: #e4eaf6;
  --good: #2f7d5c;
  --good-bg: #e3f1ea;
  --bad: #b8382c;
  --bad-bg: #f8e1de;
  --learning: #b07a10;
  --glyph: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --ui: "IBM Plex Sans", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --sheet: #181d28; --ink: #e5e8ef; --muted: #98a1b3; --line: #2b3242;
    --indigo: #8fa8e6; --indigo-soft: #1f2a44; --good: #6cc79e; --good-bg: #173126; --bad: #ee7c70; --bad-bg: #3a1c19;
    --learning: #e2b04a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --sheet: #181d28; --ink: #e5e8ef; --muted: #98a1b3; --line: #2b3242;
  --indigo: #8fa8e6; --indigo-soft: #1f2a44; --good: #6cc79e; --good-bg: #173126; --bad: #ee7c70; --bad-bg: #3a1c19;
  --learning: #e2b04a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; display: grid; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
h1 { font-family: var(--glyph); font-weight: 800; font-size: 1.8rem; margin: 0; letter-spacing: .01em; }
h1 .jp { color: var(--indigo); margin-right: .3em; }
.score { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.score div { display: grid; }
.score b { font-family: var(--mono); font-weight: 500; font-size: 1.25rem; }
.score span { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.settings { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.group > span { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { font: inherit; font-size: .8rem; letter-spacing: .04em; border: 1px solid var(--line); background: var(--sheet);
  color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--indigo); border-color: var(--indigo); color: var(--sheet); }
.chip:hover { border-color: var(--indigo); }
:is(.chip, .basket, .go):focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; }

.table { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 20px; display: grid; gap: 18px; min-width: 0; }
.baskets { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
.basket { font: inherit; color: inherit; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 8px 10px;
  display: grid; justify-items: center; gap: 6px; cursor: pointer; min-width: 0; transition: border-color .12s, transform .12s; }
.basket:hover { border-color: var(--indigo); }
.basket .key { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.basket .seal { font-family: var(--glyph); font-weight: 800; font-size: 2.4rem; line-height: 1; color: var(--indigo);
  border: 2px solid var(--indigo); border-radius: 10px; width: 64px; height: 64px; display: grid; place-items: center; background: var(--sheet); }
.basket .m { font-size: .8rem; color: var(--muted); text-align: center; min-height: 1.2em; overflow-wrap: anywhere; }
.basket .placed { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; min-height: 26px; }
.basket .placed i { font-style: normal; font-family: var(--glyph); font-size: 1.05rem; padding: 0 3px; border-radius: 4px; background: var(--good-bg); color: var(--good); }
.basket .placed i.miss { background: var(--bad-bg); color: var(--bad); }
.basket.right { border-color: var(--good); }
.basket.wrong { border-color: var(--bad); animation: shake .32s; }
.basket.answer { border-color: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.stage { display: grid; justify-items: center; gap: 10px; min-height: 190px; align-content: center; }
.tile { width: 120px; height: 132px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--sheet);
  display: grid; justify-items: center; align-content: center; gap: 4px; box-shadow: 0 6px 18px rgba(27, 34, 51, .08); }
.tile .g { font-family: var(--glyph); font-weight: 700; font-size: 4rem; line-height: 1; }
.tile .s { font-size: .78rem; color: var(--muted); text-align: center; padding-inline: 6px; min-height: 1.1em; }
.tile.enter { animation: drop .22s ease-out; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.prompt { font-size: .85rem; color: var(--muted); text-align: center; }
.feedback { min-height: 2.6em; text-align: center; font-size: .92rem; max-width: 46ch; }
.feedback .ok { color: var(--good); font-weight: 600; }
.feedback .no { color: var(--bad); font-weight: 600; }
.feedback .g { font-family: var(--glyph); font-size: 1.1rem; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: min(520px, 100%); }
.opt { font: inherit; text-align: left; background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 9px;
  padding: 9px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.opt .key { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.opt:hover { border-color: var(--indigo); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
@media (max-width: 420px) { .options { grid-template-columns: minmax(0, 1fr); } }
.queue { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.queue i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.queue i.done { background: var(--good); } .queue i.miss { background: var(--bad); } .queue i.now { background: var(--indigo); }

.summary { display: grid; gap: 12px; justify-items: center; text-align: center; }
.summary h2 { font-family: var(--glyph); font-weight: 700; font-size: 1.4rem; margin: 0; }
.summary .fams { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.summary .fam { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; justify-items: center; min-width: 96px; }
.summary .fam.built { border-color: var(--good); background: var(--good-bg); }
.summary .fam b { font-family: var(--glyph); font-size: 1.6rem; color: var(--indigo); }
.summary .fam span { font-size: .78rem; color: var(--muted); }
.summary .fam small { font-family: var(--glyph); font-size: 1rem; letter-spacing: .08em; }
.go { font: inherit; font-weight: 600; background: var(--indigo); color: var(--sheet); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }

.map { display: grid; gap: 8px; }
.map h3 { margin: 0; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.map .dots { display: flex; flex-wrap: wrap; gap: 3px; }
.map .dots i { width: 9px; height: 9px; border-radius: 2px; background: var(--line); }
.map .dots i.built { background: var(--good); }
.map .dots i.cur { background: var(--indigo); }
.map p { margin: 0; font-size: .8rem; color: var(--muted); }
.foot { font-size: .8rem; color: var(--muted); max-width: 70ch; }
@media (max-width: 520px) {
  h1 { font-size: 1.45rem; }
  .basket .seal { width: 50px; height: 50px; font-size: 1.9rem; }
  .tile { width: 104px; height: 116px; } .tile .g { font-size: 3.4rem; }
}
@media (prefers-reduced-motion: reduce) { .tile.enter, .basket.wrong { animation: none; } .basket { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1><span class="jp">家系</span>Kanji Family Builder</h1>
    <div class="score" aria-live="polite">
      <div><b id="s-score">0</b><span>score</span></div>
      <div><b id="s-streak">0</b><span>streak</span></div>
      <div><b id="s-built">0</b><span>families rebuilt</span></div>
    </div>
  </header>

  <div class="settings">
    <div class="group" id="g-level"><span>levels</span></div>
    <div class="group" id="g-mode"><span>mode</span></div>
    <div class="group" id="g-mean"><span>meanings</span></div>
  </div>

  <section class="table" id="table" aria-label="Sorting table"></section>

  <section class="map" aria-label="Your tree">
    <h3>Your tree</h3>
    <div class="dots" id="dots"></div>
    <p id="map-note"></p>
  </section>
  <p class="foot" id="foot"></p>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const F = D.families, K = D.kanji, LV = D.levels;
const parentOf = {};
for (const [f, v] of Object.entries(F)) for (const c of v.c) parentOf[c] = f;

const store = {
  get(k, d) { try { const v = localStorage.getItem("kfb:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kfb:" + k, JSON.stringify(v)); } catch {} },
};
const LEVEL_SETS = { "n5–n4": ["n5", "n4"], "n3": ["n3"], "n2": ["n2"], "n1": ["n1"], "all": LV };
const S = {
  level: store.get("level", "n5–n4"),
  mode: store.get("mode", "families"),
  meanings: store.get("meanings", true),
  built: new Set(store.get("built", [])),
  best: store.get("best", 0),
  score: 0, streak: 0,
  round: null,
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// tiles for a family: its members within the chosen levels, minus the head itself
function tilesOf(f) {
  const lv = LEVEL_SETS[S.level];
  return F[f].k.filter(k => k !== f && lv.includes(K[k][1]));
}
function familiarity(f) {
  const ts = F[f].k;
  return ts.filter(k => K[k][2] !== "new").length / ts.length;
}
function pickFamilies() {
  const ok = Object.keys(F).filter(f => tilesOf(f).length >= 1);
  const fresh = ok.filter(f => !S.built.has(f));
  const pool = fresh.length >= 3 ? fresh : ok;
  if (S.mode === "cousins") {
    const parents = shuffle(Object.keys(F).filter(p => F[p].c.filter(c => tilesOf(c).length).length >= 3));
    for (const p of parents) {
      const kids = shuffle(F[p].c.filter(c => tilesOf(c).length));
      const unbuilt = kids.filter(c => !S.built.has(c));
      const pick = (unbuilt.length >= 3 ? unbuilt : kids).slice(0, 3);
      if (pick.length === 3) return { fams: pick, parent: p };
    }
  }
  // weight toward families you partly know, so a round is winnable but still teaches
  const weighted = shuffle(pool.slice()).sort((a, b) => familiarity(b) - familiarity(a) + (Math.random() - .5) * .6);
  const out = [];
  const tileCount = () => out.reduce((n, g) => n + Math.min(tilesOf(g).length, 5), 0);
  for (const f of weighted) {
    if (out.some(g => F[g].k.includes(f) || F[f].k.includes(g))) continue;
    out.push(f);
    // most families are small, so a fourth basket keeps a round from being over in three taps
    if (out.length === 4 || (out.length === 3 && tileCount() >= 6)) break;
  }
  return { fams: out, parent: null };
}

function newRound() {
  const { fams, parent } = pickFamilies();
  if (fams.length < 2) { renderEmpty(); return; }
  const tiles = shuffle(fams.flatMap(f => tilesOf(f).slice(0, 5).map(k => ({ k, f }))));
  S.round = { fams, parent, tiles, i: 0, results: [], missedFams: new Set(), locked: false, phase: "family", opts: null };
  renderTable();
}

function renderEmpty() {
  document.getElementById("table").innerHTML = `<div class="summary"><h2>Nothing to sort at this level</h2><p>Pick another level above.</p></div>`;
}

function renderTable() {
  const R = S.round;
  const t = document.getElementById("table");
  t.style.setProperty("--n", R.fams.length);
  t.innerHTML = `
    ${R.parent ? `<p class="prompt">Cousins: all three hang under <b class="g" style="font-family:var(--glyph)">${R.parent}</b> ${F[R.parent].m ? "(" + F[R.parent].m + ")" : ""}. Look for the part that differs.</p>` : ""}
    <div class="baskets" role="group" aria-label="Families">
      ${R.fams.map((f, i) => `<button class="basket" type="button" data-f="${f}" aria-label="Family ${f} ${F[f].m || ""}, key ${i + 1}">
        <span class="key">${i + 1}</span><span class="seal">${f}</span><span class="m">${F[f].m || "&nbsp;"}</span><span class="placed"></span></button>`).join("")}
    </div>
    <div class="stage" id="stage"></div>
    <div class="queue" id="queue"></div>`;
  t.querySelectorAll(".basket").forEach(b => b.addEventListener("click", () => answer(b.dataset.f)));
  showTile();
}

function showTile() {
  const R = S.round;
  const { k } = R.tiles[R.i];
  const [gloss, lv, st] = K[k];
  const showMeaning = st === "new";
  document.getElementById("stage").innerHTML = `
    <div class="tile enter" aria-label="${k}"><span class="g">${k}</span><span class="s">${showMeaning ? gloss : "&nbsp;"}</span></div>
    <p class="prompt">${showMeaning ? "new to you: which family is it built on?" : "which family is it built on?"} <span style="font-family:var(--mono)">${lv.toUpperCase()}</span></p>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  document.getElementById("queue").innerHTML = R.tiles.map((_, j) =>
    `<i class="${j < R.i ? (tileOk(R.results[j]) ? "done" : "miss") : j === R.i ? "now" : ""}"></i>`).join("");
  R.locked = false;
  R.phase = "family";
}

function answer(f) {
  const R = S.round;
  if (!R || R.locked) return;
  R.locked = true;
  const { k, f: right } = R.tiles[R.i];
  const ok = f === right;
  R.results.push({ fam: ok, mean: null });
  const [gloss, , st] = K[k];
  const b = document.querySelector(`.basket[data-f="${f}"]`);
  const rb = document.querySelector(`.basket[data-f="${right}"]`);
  rb.querySelector(".placed").insertAdjacentHTML("beforeend", `<i class="${ok ? "" : "miss"}">${k}</i>`);
  const fb = document.getElementById("fb");
  // the meaning is asked next for kanji you know or are learning, so don't give it away here
  const ask = S.meanings && st !== "new";
  const told = ask ? "" : ` ${gloss}`;
  if (ok) {
    S.streak++; S.score += 10 * Math.min(S.streak, 5);
    b.classList.add("right");
    fb.innerHTML = `<span class="ok">✓</span> <span class="g">${k}</span>${told}`;
  } else {
    S.streak = 0; R.missedFams.add(right);
    b.classList.add("wrong"); rb.classList.add("answer");
    fb.innerHTML = `<span class="no">✗</span> <span class="g">${k}</span>${told ? told + ":" : ""} built on <span class="g">${right}</span>${F[right].m ? " " + F[right].m : ""}, not <span class="g">${f}</span>`;
  }
  if (S.streak > S.best) { S.best = S.streak; store.set("best", S.best); }
  renderScore();
  setTimeout(() => {
    b.classList.remove("right", "wrong"); rb.classList.remove("answer");
    ask ? showMeaningStep() : advance();
  }, ok ? 650 : 1700);
}

function advance() {
  const R = S.round;
  R.i++;
  R.i < R.tiles.length ? showTile() : endRound();
}

const tileOk = r => r.fam && r.mean !== false;
const words = s => new Set(s.toLowerCase().match(/[a-z']{3,}/g) || []);
const overlaps = (a, b) => { const A = words(a); return [...words(b)].some(w => A.has(w)); };

function meaningOptions(k) {
  const R = S.round, right = K[k][0];
  const fam = R.tiles[R.i].f;
  const pools = [
    shuffle(F[fam].k.filter(x => x !== k)),
    shuffle(R.tiles.map(t => t.k).filter(x => x !== k)),
    shuffle(Object.keys(K).filter(x => K[x][1] === K[k][1] && x !== k)).slice(0, 60),
  ];
  const picked = [];
  for (const pool of pools) for (const x of pool) {
    const g = K[x][0];
    if (picked.length < 3 && g !== right && !picked.includes(g) && !overlaps(g, right)) picked.push(g);
  }
  return shuffle([right, ...picked]);
}

function showMeaningStep() {
  const R = S.round;
  const { k } = R.tiles[R.i];
  R.phase = "meaning";
  R.opts = meaningOptions(k);
  document.getElementById("stage").innerHTML = `
    <div class="tile" aria-label="${k}"><span class="g">${k}</span><span class="s">&nbsp;</span></div>
    <p class="prompt">and what does it mean?</p>
    <div class="options" role="group" aria-label="Meanings">${R.opts.map((g, i) =>
      `<button class="opt" type="button" data-i="${i}"><span class="key">${i + 1}</span><span>${g}</span></button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMeaning(+b.dataset.i)));
  R.locked = false;
}

function answerMeaning(i) {
  const R = S.round;
  if (!R || R.locked || R.phase !== "meaning") return;
  R.locked = true;
  const { k, f } = R.tiles[R.i];
  const right = K[k][0], ok = R.opts[i] === right;
  R.results[R.results.length - 1].mean = ok;
  const btns = document.querySelectorAll(".opt");
  btns[R.opts.indexOf(right)].classList.add("right");
  const fb = document.getElementById("fb");
  if (ok) {
    S.streak++; S.score += 10 * Math.min(S.streak, 5);
    fb.innerHTML = `<span class="ok">✓</span> <span class="g">${k}</span> ${right}`;
  } else {
    btns[i].classList.add("wrong");
    S.streak = 0; R.missedFams.add(f);
    fb.innerHTML = `<span class="no">✗</span> <span class="g">${k}</span> means ${right}`;
  }
  if (S.streak > S.best) { S.best = S.streak; store.set("best", S.best); }
  renderScore();
  setTimeout(advance, ok ? 650 : 1600);
}

function endRound() {
  const R = S.round;
  const builtNow = R.fams.filter(f => !R.missedFams.has(f));
  builtNow.forEach(f => S.built.add(f));
  store.set("built", [...S.built]);
  const right = R.results.filter(r => r.fam).length;
  const asked = R.results.filter(r => r.mean !== null), meant = asked.filter(r => r.mean).length;
  document.getElementById("table").innerHTML = `
    <div class="summary">
      <h2>${right} of ${R.results.length} sorted${asked.length ? ` · ${meant} of ${asked.length} meanings` : ""}</h2>
      <div class="fams">${R.fams.map(f => `<div class="fam ${builtNow.includes(f) ? "built" : ""}">
        <b>${f}</b><span>${builtNow.includes(f) ? "rebuilt" : "try again later"}</span><small>${F[f].k.join("")}</small></div>`).join("")}</div>
      <button class="go" id="next" type="button">Next round</button>
      <p class="prompt">or press Enter</p>
    </div>`;
  document.getElementById("next").addEventListener("click", newRound);
  document.getElementById("next").focus();
  S.round = null;
  renderScore(); renderMap();
}

function renderScore() {
  document.getElementById("s-score").textContent = S.score;
  document.getElementById("s-streak").textContent = S.streak + (S.best ? ` / ${S.best}` : "");
  document.getElementById("s-built").textContent = `${S.built.size} / ${Object.keys(F).length}`;
}

function renderMap() {
  const cur = new Set(S.round ? S.round.fams : []);
  const order = Object.keys(F).sort((a, b) => F[b].k.length - F[a].k.length || a.localeCompare(b));
  document.getElementById("dots").innerHTML = order.map(f =>
    `<i class="${S.built.has(f) ? "built" : cur.has(f) ? "cur" : ""}" title="${f} ${F[f].m || ""}: ${F[f].k.join("")}"></i>`).join("");
  const n = Object.keys(F).length;
  document.getElementById("map-note").textContent =
    `${S.built.size} of ${n} families rebuilt (every kanji sorted right in one round). Each square is a family, largest first.`;
}

function bindSettings() {
  const gl = document.getElementById("g-level");
  gl.insertAdjacentHTML("beforeend", Object.keys(LEVEL_SETS).map(l =>
    `<button class="chip" type="button" data-v="${l}" aria-pressed="${S.level === l}">${l.toUpperCase()}</button>`).join(""));
  gl.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    S.level = b.dataset.v; store.set("level", S.level);
    gl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === S.level));
    newRound();
  });
  const gm = document.getElementById("g-mode");
  gm.insertAdjacentHTML("beforeend", [["families", "Families"], ["cousins", "Cousins (harder)"]].map(([v, l]) =>
    `<button class="chip" type="button" data-v="${v}" aria-pressed="${S.mode === v}">${l}</button>`).join(""));
  gm.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    S.mode = b.dataset.v; store.set("mode", S.mode);
    gm.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.v === S.mode));
    newRound();
  });
  const gn = document.getElementById("g-mean");
  gn.insertAdjacentHTML("beforeend", [[true, "On"], [false, "Off"]].map(([v, l]) =>
    `<button class="chip" type="button" data-v="${v}" aria-pressed="${S.meanings === v}">${l}</button>`).join(""));
  gn.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    S.meanings = b.dataset.v === "true"; store.set("meanings", S.meanings);
    gn.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", (c.dataset.v === "true") === S.meanings));
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, select, textarea")) return;
    if (S.round && S.round.phase === "meaning" && /^[1-4]$/.test(e.key)) {
      e.preventDefault(); answerMeaning(+e.key - 1);
    } else if (S.round && /^[1-4]$/.test(e.key)) {
      const f = S.round.fams[+e.key - 1];
      if (f) { e.preventDefault(); answer(f); }
    } else if (!S.round && e.key === "Enter" && document.getElementById("next")) {
      e.preventDefault(); newRound();
    }
  });
}

document.getElementById("foot").textContent =
  `Built from your Japanese vault on ${D.generated}: the same families as the Kanji Family Tree and the quiz's --clusters mode. ` +
  `Kanji you haven't started show their meaning; ones you know or are learning are asked for it after you sort them. ` +
  `A family counts as rebuilt when every kanji in it was sorted and, where asked, given the right meaning. Scores are kept in this browser only.`;
bindSettings();
renderScore();
newRound();
renderMap();
</script>
